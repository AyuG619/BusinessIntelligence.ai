# 4 connected KPIs (primary / driver / outcome / value)

kpis:
  cross_sell_revenue:
    label: "Cross-Sell Revenue"
    role: primary
    unit: currency
    table: revenue_transactions
    value_column: amount
    filter: "product_category = 'cross_sell'"
    group_by: [month, branch_id]
    higher_is_better: true
    drivers: [product_code, lead_status]
    lineage: "revenue_transactions.amount filtered by product_category=cross_sell, grouped by month and branch_id"
    access_scope: "branch aggregate; customer detail restricted by RBAC"
    refresh_cadence: "daily transactions, monthly KPI view"

  lead_conversion_rate:
    label: "Lead Conversion Rate"
    role: driver
    unit: percent
    table: leads
    numerator: "status = 'converted'"
    denominator: "1=1"
    group_by: [month, branch_id]
    higher_is_better: true
    drivers: [lead_status, product_code]
    lineage: "leads.status=converted divided by all leads, grouped by created month and branch_id"
    access_scope: "branch aggregate; customer detail restricted by RBAC"
    refresh_cadence: "daily"

  customer_retention_rate:
    label: "Customer Retention Rate"
    role: outcome
    unit: percent
    table: customers
    numerator: "status = 'active'"
    denominator: "1=1"
    group_by: [month, branch_id]
    higher_is_better: true
    drivers: [customer.status, onboarding_cohort]
    lineage: "customers.status=active divided by onboarding cohort, grouped by onboarded month and branch_id"
    access_scope: "branch aggregate; customer detail restricted by RBAC"
    refresh_cadence: "monthly"

  revenue_per_customer:
    label: "Revenue Per Customer"
    role: value
    unit: currency
    table: revenue_transactions
    value_column: amount
    denominator_table: customers
    group_by: [month, branch_id]
    higher_is_better: true
    drivers: [amount, customer_id, product_code]
    lineage: "revenue_transactions.amount divided by distinct revenue customer_id, grouped by month and branch_id"
    access_scope: "branch aggregate; customer detail restricted by RBAC"
    refresh_cadence: "daily transactions, monthly KPI view"

materiality_thresholds:
  low: 0.05
  medium: 0.10
  high: 0.20
